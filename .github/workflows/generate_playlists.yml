name: Generate M3U Playlists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'generate_playlists.py'
      - 'requirements.txt'
      - '.github/workflows/generate_playlists.yml'

permissions:
  contents: write

jobs:
  build-playlists:
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Playlist Generation Script
        run: python generate_playlists.py

      - name: Validate Plex US Playlist
        run: |
          PLAYLIST="playlists/plex_us.m3u"

          if [ ! -s "$PLAYLIST" ]; then
            echo "::error::Plex US playlist is missing or empty"
            exit 1
          fi

          if ! grep -q '^#EXTINF:' "$PLAYLIST"; then
            echo "::error::Plex US playlist contains no channels"
            exit 1
          fi

          CHANNEL_COUNT=$(grep -c '^#EXTINF:' "$PLAYLIST")
          echo "Generated $CHANNEL_COUNT Plex US channels"

      - name: Fix Tubi EPG URL
        run: |
          GITHUB_RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/playlists/tubi_epg.xml"

          if [ -f "playlists/tubi_all.m3u" ]; then
            sed -i "s|url-tvg=\"tubi_epg.xml\"|url-tvg=\"$GITHUB_RAW_URL\"|g" playlists/tubi_all.m3u
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A playlists/

          if ! git diff --cached --quiet; then
            git commit -m "Update FAST playlists"
            git push origin main
          else
            echo "No playlist changes detected"
          fi
